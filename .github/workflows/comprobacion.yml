# Comprobación automática (T-006): formato, análisis estático, tipos y pruebas.
# Se ejecuta en GitHub con cada push y cada pull request.
name: Comprobación

on:
  push:
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
